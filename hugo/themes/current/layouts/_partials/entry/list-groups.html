{{ range .Groups }}
    <div class="max-w-4xl mx-auto space-y-8">
        <div class="prose max-w-none prose-stone font-serif px-4">
            <h1 id="{{ .Key }}">{{ .Key }}</h1>
        </div>
    </div>
    {{ partial "entry/list" ( dict
        "Page" $.Page
        "Pages" .Pages.ByDate.Reverse
    ) }}
{{ end }}
