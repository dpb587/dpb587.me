baseURL: https://dpb587.me/
contentDir: '../content'
copyright: "Unless noted, software code is licensed under MIT License and all other content under CC-BY-NC."
disableKinds:
- rss
- taxonomy
- term
frontmatter:
  # used as an explicit property; no fallback to date
  publishDate:
  - publishdate
locale: 'en-us'
markup:
  goldmark:
    extensions:
      # dislike the conversions; only want dashes
      typographer:
        apostrophe: "'"
        disable: false
        ellipsis: '...'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: "&lt;&lt;"
        leftDoubleQuote: '"'
        leftSingleQuote: "'"
        rightAngleQuote: "&gt;&gt;"
        rightDoubleQuote: '"'
        rightSingleQuote: "'"
params:
  repository: "https://github.com/dpb587/dpb587.me"
  commentsRemarkUrl: "https://dpb587.me/comments.v2" # http://localhost:1315
permalinks:
  page:
    # article is used for long-form writing about a particular topic, finding, or opinion. It typically refers to ideas
    # relevant at a particular moment in time, and is likely to become outdated in the future.
    article: '/entries/:sections[2:]/:contentbasename'
    
    # post is used for ad hoc notes, thoughts, or updates. Generally not as useful on its own and typically assumes
    # additional context. May be the basis of other, more well-formed content types at a later time.
    post: '/entries/:sections[2:]/:contentbasename'

    # media describes an audio, image, and video files
    media: '/entries/:sections[2:]/:contentbasename'

    # route describes an gps-related route files
    route: '/entries/:sections[2:]/:contentbasename'

    # story is used as a logical content grouping for narrating a particular event. Might be better as a generic "nav"
    # type in the future.
    story: '/entries/:sections[2:]/:contentbasename'

    # wiki is used as a reference point for specific topics which are updated over time.
    wiki: '/wiki/:contentbasename'

    # taxonomies and organizational content
    topic: '/topics/:sections[1:]/:contentbasename'
    
    # generic content
    certification: '/about/certification/:sections[1:]/:slug'
    page: '/:sections[1:]/:contentbasename'
    project: '/projects/:sections[1:]/:contentbasename'
    occupation: '/about/occupation/:sections[1:]/:slug'
  section:
    certification: '/about/certification/:sections[1:]'
    topic: '/topics/:sections[1:]'
    occupation: '/about/occupation/:sections[1:]'
    project: '/projects/:sections[1:]'
    story: '/entries/:sections[2:]'
    post: '/entries/:sections[2:]'
# had trouble making builtin work with some additional metadata, hierarchy behaviors, and inter-taxonomy refs i wanted
# using nav-* types with some taxonomy-ish behaviors
taxonomies: {}
theme: 'current'
title: "Danny Berger"
